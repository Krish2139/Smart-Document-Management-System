name: Continuous Deployment (CD)

# Trigger CD strictly after the CI workflow successfully completes on main
on:
  workflow_run:
    workflows: ["Smart Document Management System CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact Git commit SHA to deploy (leave blank for latest main commit)"
        required: false
        default: ""
      reason:
        description: "Reason for manual deployment trigger"
        required: false
        default: "Manual deployment via GitHub Console"

# Principle of least privilege
permissions:
  contents: read

# Ensure only one deployment executes at a time to prevent overlapping releases
concurrency:
  group: production-ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Guard: Deploy ONLY if CI succeeded on a push event to main, or if manually triggered
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      # Step 1: Resolve the exact commit SHA verified by CI (Never blindly pull origin/main)
      - name: Resolve Target Commit SHA
        id: resolve-sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TARGET_SHA="${{ github.event.workflow_run.head_sha }}"
            echo "Deployment triggered by CI workflow run."
            echo "CI Workflow ID: ${{ github.event.workflow_run.id }}"
            echo "CI Conclusion:  ${{ github.event.workflow_run.conclusion }}"
          else
            if [ -n "${{ inputs.commit_sha }}" ]; then
              TARGET_SHA="${{ inputs.commit_sha }}"
              echo "Deployment manually dispatched with explicit SHA: $TARGET_SHA"
            else
              TARGET_SHA="${{ github.sha }}"
              echo "Deployment manually dispatched defaulting to HEAD SHA: $TARGET_SHA"
            fi
          fi

          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "=========================================================="
          echo "Target Commit SHA to Deploy: $TARGET_SHA"
          echo "Target Host:                 ${{ secrets.EC2_HOST }}"
          echo "Target User:                 ${{ secrets.EC2_USER }}"
          echo "=========================================================="

      # Step 2: Validate that all required deployment secrets are present
      - name: Validate Deployment Secrets
        run: |
          MISSING=0
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "::error::Secret EC2_HOST is not configured in repository secrets."
            MISSING=1
          fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "::error::Secret EC2_USER is not configured in repository secrets."
            MISSING=1
          fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "::error::Secret EC2_SSH_KEY is not configured in repository secrets."
            MISSING=1
          fi
          if [ "$MISSING" -ne 0 ]; then
            echo "Aborting deployment: required repository secrets are missing."
            exit 1
          fi
          echo "Verified: Required repository secrets are present."

      # Step 3: Check out the exact verified commit in the runner to obtain scripts/deploy.sh
      - name: Checkout Repository at Verified SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-sha.outputs.target_sha }}

      # Step 4: Configure secure SSH environment with host-key verification
      - name: Configure Secure SSH Client
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write SSH private key with strict 600 permissions
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Configure host key verification
          SSH_PORT="${{ secrets.EC2_PORT || '22' }}"
          if [ -n "${{ secrets.EC2_SSH_KNOWN_HOSTS }}" ]; then
            echo "Configuring pre-verified EC2_SSH_KNOWN_HOSTS from GitHub Secrets..."
            echo "${{ secrets.EC2_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
            echo "SSH_STRICT_HOST_CHECK=yes" >> "$GITHUB_ENV"
          else
            echo "Notice: EC2_SSH_KNOWN_HOSTS secret not provided. Attempting discovery via ssh-keyscan..."
            if ssh-keyscan -T 5 -p "$SSH_PORT" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
              chmod 644 ~/.ssh/known_hosts
              echo "Host key successfully retrieved via ssh-keyscan."
              echo "SSH_STRICT_HOST_CHECK=yes" >> "$GITHUB_ENV"
            else
              echo "Notice: Host key not discovered ahead of time. Setting host key policy to 'accept-new'."
              echo "SSH_STRICT_HOST_CHECK=accept-new" >> "$GITHUB_ENV"
            fi
          fi

      # Step 5: Execute deployment script on EC2 (Single source of truth)
      - name: Execute Deployment on EC2
        env:
          TARGET_SHA: ${{ steps.resolve-sha.outputs.target_sha }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_PORT: ${{ secrets.EC2_PORT || '22' }}
        run: |
          echo "=========================================================="
          echo "Connecting to $EC2_USER@$EC2_HOST:$SSH_PORT..."
          echo "Strict Host Checking: $SSH_STRICT_HOST_CHECK"
          echo "Target Commit SHA:    $TARGET_SHA"
          echo "=========================================================="

          ssh -o StrictHostKeyChecking="$SSH_STRICT_HOST_CHECK" \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              -o IdentitiesOnly=yes \
              -i ~/.ssh/deploy_key \
              -p "$SSH_PORT" \
              "$EC2_USER@$EC2_HOST" "bash -s -- $TARGET_SHA" < scripts/deploy.sh

      # Step 6: Securely remove temporary SSH credentials
      - name: Cleanup SSH Deployment Credentials
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          echo "Cleaned up temporary SSH private key from runner."
