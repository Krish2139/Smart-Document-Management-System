name: Continuous Deployment (CD)

on:
  workflow_run:
    workflows: ["Smart Document Management System CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment trigger"
        required: false
        default: "Manual deployment trigger"

permissions:
  contents: read

concurrency:
  group: production-ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Security & Guard: Deploy ONLY if CI passed on main branch push, or if triggered manually
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Display Deployment Context
        run: |
          echo "=========================================================="
          echo "Continuous Deployment Triggered"
          echo "Event: ${{ github.event_name }}"
          echo "Triggered by: ${{ github.actor }}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "CI Workflow ID: ${{ github.event.workflow_run.id }}"
            echo "CI Conclusion: ${{ github.event.workflow_run.conclusion }}"
            echo "CI Head Branch: ${{ github.event.workflow_run.head_branch }}"
            echo "CI Head SHA: ${{ github.event.workflow_run.head_sha }}"
          fi
          echo "Target Host: ${{ secrets.EC2_HOST }}"
          echo "Target User: ${{ secrets.EC2_USER }}"
          echo "=========================================================="

      - name: Validate Deployment Secrets
        run: |
          MISSING_SECRETS=0
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "::error::Secret EC2_HOST is not configured in repository secrets."
            MISSING_SECRETS=1
          fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then
            echo "::error::Secret EC2_USER is not configured in repository secrets."
            MISSING_SECRETS=1
          fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "::error::Secret EC2_SSH_KEY is not configured in repository secrets."
            MISSING_SECRETS=1
          fi
          if [ "$MISSING_SECRETS" -ne 0 ]; then
            echo "Aborting deployment due to missing required secrets."
            exit 1
          fi
          echo "All required deployment secrets are present."

      - name: Configure Secure SSH Environment
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write deployment private key with strict 600 permissions
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Establish host key verification
          SSH_PORT="${{ secrets.EC2_PORT || '22' }}"
          if [ -n "${{ secrets.EC2_SSH_KNOWN_HOSTS }}" ]; then
            echo "Using pre-configured EC2_SSH_KNOWN_HOSTS from GitHub Secrets..."
            echo "${{ secrets.EC2_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
          else
            echo "Fetching host key via ssh-keyscan..."
            ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
          fi

      - name: Execute Deployment on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_PORT: ${{ secrets.EC2_PORT || '22' }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
              -o IdentitiesOnly=yes \
              -i ~/.ssh/deploy_key \
              -p "$SSH_PORT" \
              "$EC2_USER@$EC2_HOST" 'bash -s' << 'EOF'
            set -euo pipefail

            APP_DIR="/home/ec2-user/Smart-Document-Management-System"
            SERVICE_NAME="sdm-app.service"
            LOCK_FILE="/tmp/sdm_deploy.lock"
            HEALTH_URL="http://127.0.0.1:8000/api/health"

            echo "=========================================================="
            echo ">>> [1/7] ACQUIRING DEPLOYMENT LOCK"
            echo "=========================================================="
            exec 200>"$LOCK_FILE"
            if ! flock -n 200; then
              echo "ERROR: Another deployment is currently in progress. Exiting."
              exit 1
            fi
            trap 'exec 200>&-; rm -f "$LOCK_FILE"' EXIT

            echo "=========================================================="
            echo ">>> [2/7] PRE-DEPLOYMENT INSPECTION & DIRECTORY CHECK"
            echo "=========================================================="
            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: Target directory $APP_DIR does not exist on EC2 instance."
              exit 1
            fi
            cd "$APP_DIR"

            # Check that production environment file is preserved
            if [ ! -f ".env" ]; then
              echo "ERROR: Critical production configuration file .env is missing in $APP_DIR!"
              exit 1
            fi
            echo "Verified .env exists. It will be protected from modification."

            # Record state for safe rollback
            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "HEAD")
            echo "Current deployed commit: $PREV_COMMIT"

            OLD_REQ_HASH=""
            if [ -f "requirements.txt" ]; then
              OLD_REQ_HASH=$(sha256sum requirements.txt | cut -d' ' -f1)
            fi

            echo "=========================================================="
            echo ">>> [3/7] UPDATING APPLICATION CODE (Controlled Git Fetch)"
            echo "=========================================================="
            # Fetch latest commits without touching untracked local data
            git fetch origin main

            # Update working tree to latest origin/main
            # Note: We deliberately DO NOT run 'git clean' to preserve:
            # - .env (environment variables & secrets)
            # - smart_document_manager.db (and WAL/SHM SQLite data)
            # - local_storage/ (production documents)
            git checkout main
            git reset --hard origin/main

            NEW_COMMIT=$(git rev-parse HEAD)
            echo "Successfully updated codebase to: $NEW_COMMIT"

            # Guarantee production assets remain intact
            if [ ! -f ".env" ]; then
              echo "ERROR: .env missing after git reset. Rolling back immediately!"
              git reset --hard "$PREV_COMMIT"
              exit 1
            fi

            echo "=========================================================="
            echo ">>> [4/7] DEPENDENCY MANAGEMENT"
            echo "=========================================================="
            if [ ! -d "venv" ]; then
              echo "Creating virtual environment at $APP_DIR/venv..."
              python3.12 -m venv venv || python3 -m venv venv
            fi

            NEW_REQ_HASH=$(sha256sum requirements.txt | cut -d' ' -f1)
            if [ "$OLD_REQ_HASH" != "$NEW_REQ_HASH" ]; then
              echo "requirements.txt changed ($OLD_REQ_HASH -> $NEW_REQ_HASH). Updating pip dependencies..."
              ./venv/bin/pip install --upgrade pip
              ./venv/bin/pip install --no-cache-dir -r requirements.txt
            else
              echo "Dependencies unchanged. Skipping pip install."
            fi

            echo "=========================================================="
            echo ">>> [5/7] PRE-FLIGHT VALIDATION (Zero-Downtime Verification)"
            echo "=========================================================="
            echo "Compiling Python source code to verify syntax..."
            if ! ./venv/bin/python -m compileall backend/ > /dev/null; then
              echo "ERROR: Python compilation check failed! Rolling back to $PREV_COMMIT..."
              git reset --hard "$PREV_COMMIT"
              exit 1
            fi

            echo "Verifying application imports and startup configuration..."
            if ! ./venv/bin/python -c "import backend.main; print('FastAPI module import verified successfully.')"; then
              echo "ERROR: Application import verification failed! Rolling back to $PREV_COMMIT..."
              git reset --hard "$PREV_COMMIT"
              exit 1
            fi

            echo "=========================================================="
            echo ">>> [6/7] RESTARTING SYSTEMD SERVICE ($SERVICE_NAME)"
            echo "=========================================================="
            sudo systemctl restart "$SERVICE_NAME"

            echo "=========================================================="
            echo ">>> [7/7] POST-DEPLOYMENT HEALTH VERIFICATION"
            echo "=========================================================="
            MAX_ATTEMPTS=15
            ATTEMPT=1
            IS_HEALTHY=0

            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "Health check probe $ATTEMPT/$MAX_ATTEMPTS..."
              if sudo systemctl is-active --quiet "$SERVICE_NAME"; then
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
                if [ "$HTTP_CODE" = "200" ]; then
                  echo "Health check PASSED with HTTP 200 from $HEALTH_URL!"
                  IS_HEALTHY=1
                  break
                else
                  echo "Service running, awaiting HTTP 200 (current: $HTTP_CODE)..."
                fi
              else
                echo "Service initializing..."
              fi
              sleep 2
              ATTEMPT=$((ATTEMPT + 1))
            done

            if [ $IS_HEALTHY -ne 1 ]; then
              echo "ERROR: Post-deployment health check failed after $MAX_ATTEMPTS attempts!"
              echo "--- Systemd Service Status ---"
              sudo systemctl status "$SERVICE_NAME" --no-pager || true
              echo "--- Recent Journal Logs ---"
              sudo journalctl -u "$SERVICE_NAME" -n 50 --no-pager || true

              echo "Executing automatic rollback to $PREV_COMMIT..."
              git reset --hard "$PREV_COMMIT"
              sudo systemctl restart "$SERVICE_NAME"
              exit 1
            fi

            echo "=========================================================="
            echo "CONTINUOUS DEPLOYMENT TO EC2 COMPLETED SUCCESSFULLY!"
            echo "Deployed commit: $NEW_COMMIT"
            echo "=========================================================="
          EOF

      - name: Cleanup SSH Credentials
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
          echo "Cleaned up SSH deployment key from runner."
